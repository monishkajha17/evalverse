<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="EvalVerse  Evaluation and observability for AI agents">
  <defs>
    <linearGradient id="verse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8EC5FF"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="16%" cy="-5%" r="52%">
      <stop offset="0%" stop-color="#8EC5FF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#2DD4BF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050A14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E6F1FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="#050A14"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="56" y="128" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="300" letter-spacing="-2" fill="#E6F1FF">Eval</text>
  <text x="200" y="128" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="300" letter-spacing="-2" fill="url(#verse)">Verse</text>

  <!-- Tagline -->
  <text x="56" y="188" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#E6F1FF" fill-opacity="0.72">Evaluation and observability for AI agents that see, hear, read and act.</text>

  <!-- Flow diagram (hairline) -->
  <g transform="translate(820, 70)" fill="none" stroke="#E6F1FF" stroke-opacity="0.55" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <!-- receipt -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="28" height="36" rx="2"/>
      <path d="M6 10h16M6 16h16M6 22h10"/>
    </g>
    <!-- film strip -->
    <g transform="translate(0,56)">
      <rect x="0" y="0" width="36" height="28" rx="2"/>
      <path d="M8 0v28M28 0v28M12 8h12v12H12z"/>
      <path d="M3 6h2M3 14h2M3 22h2M31 6h2M31 14h2M31 22h2" stroke-width="1"/>
    </g>
    <!-- speech bubble -->
    <g transform="translate(0,112)">
      <path d="M2 4h32a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H14l-6 8v-8H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
      <path d="M8 12h16M8 17h10"/>
    </g>
    <!-- waveform -->
    <g transform="translate(0,176)">
      <path d="M2 14v0M8 8v12M14 4v20M20 10v8M26 6v16M32 12v4"/>
    </g>

    <!-- converging lines into box -->
    <path d="M40 18 C70 18, 70 100, 110 100"/>
    <path d="M40 70 C70 70, 70 100, 110 100"/>
    <path d="M40 126 C70 126, 70 100, 110 100"/>
    <path d="M40 190 C70 190, 70 100, 110 100"/>

    <!-- merge box -->
    <rect x="110" y="84" width="56" height="32" rx="3"/>
    <text x="138" y="104" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#E6F1FF" fill-opacity="0.8" stroke="none">agent</text>

    <!-- arrow to trace -->
    <path d="M166 100 H198"/>
    <path d="M192 96 l6 4 -6 4"/>

    <!-- trace box -->
    <rect x="198" y="84" width="56" height="32" rx="3"/>
    <text x="226" y="104" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#E6F1FF" fill-opacity="0.8" stroke="none">trace</text>

    <!-- arrow to verdict -->
    <path d="M254 100 H286"/>
    <path d="M280 96 l6 4 -6 4"/>

    <!-- verdict (red) -->
    <rect x="286" y="84" width="72" height="32" rx="3" stroke="#F43F5E" stroke-opacity="0.95"/>
    <text x="322" y="104" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#F43F5E" stroke="none">verdict</text>
  </g>
</svg>

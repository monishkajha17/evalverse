[project]
name = "evalverse"
version = "0.1.0"
description = "Evaluation and observability for AI agents that see, hear, read and act."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Monishka Jha" },
]
keywords = [
  "evaluation",
  "observability",
  "multimodal",
  "agents",
  "llm",
  "meta-model-api",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://evalverse-one.vercel.app"
Documentation = "https://evalverse-one.vercel.app/docs"
Repository = "https://github.com/evalverse/evalverse"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
